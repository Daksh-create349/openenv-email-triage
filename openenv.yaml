action_model: app.models:Action
action_space:
  category:
    options:
    - billing
    - technical
    - spam
    - general
    type: string
  priority:
    options:
    - low
    - medium
    - high
    - critical
    type: string
  response:
    description: Professional reply to the customer (min 30 chars)
    type: string
author: daksh-srivastava
description: 'A real-world customer support email triage environment. An AI agent
  must classify incoming customer emails by category (billing, technical, spam, general),
  assign the correct priority (low, medium, high, critical), and generate a professional
  response. Three difficulty tiers test increasingly complex, ambiguous, and high-stakes
  email scenarios.

  '
entrypoint: app.env:EmailTriageEnv
http_endpoints:
- "POST /reset   \u2014 start new episode, returns Observation"
- "POST /step    \u2014 submit Action, returns {observation, reward, done, info}"
- "GET  /state   \u2014 returns full State"
- "GET  /tasks   \u2014 list available tasks"
- "GET  /health  \u2014 health check"
name: email-triage-env
observation_model: app.models:Observation
observation_space:
  current_email:
    body: string
    id: int
    sender: string
    subject: string
    timestamp: string (ISO 8601)
  history: list of {email_id, score}
  step: int
  task_id: string
  total_steps: int
reward:
  components:
  - description: Exact match of predicted vs expected category
    name: category_accuracy
    weight: 0.35
  - description: Exact match (full credit) or 1-level-off (partial credit)
    name: priority_accuracy
    weight: 0.3
  - description: Keyword coverage of expected response terms
    name: response_quality
    weight: 0.35
  range: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  type: discrete
reward_model: app.models:Reward
state_model: app.models:State
tags:
- openenv
- email
- triage
- customer-support
- nlp
tasks:
- description: '10 unambiguous emails. Category and priority clearly telegraphed.
    Tests fundamental classification ability.

    '
  difficulty: easy
  id: easy
  max_score: 0.9
  name: Basic Email Triage
  num_emails: 10
- description: "10 emails requiring reading comprehension and business context. Priority\
    \ judgment is nuanced \u2014 some routine-looking emails are actually urgent.\n"
  difficulty: medium
  id: medium
  max_score: 0.9
  name: Intermediate Email Triage
  num_emails: 10
- description: '10 complex, high-stakes, ambiguous emails: legal threats, GDPR requests,
    data loss, security breaches, multi-issue complaints. Tests edge-case handling
    and appropriate escalation. Frontier models typically score below 0.7 here.

    '
  difficulty: hard
  id: hard
  max_score: 0.9
  name: Advanced Email Triage
  num_emails: 10
version: 1.0.0
